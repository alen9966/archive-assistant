<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目资料归档助手</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --line: #d8dee6;
      --text: #1f2a37;
      --muted: #5b6775;
      --accent: #1b6aa3;
      --accent2: #0e4d78;
      --ok: #1f7a4d;
      --warn: #b45309;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --ok-bg: #e8f6ee;
      --warn-bg: #fff4e5;
      --dup-bg: #eef2ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    header {
      background: linear-gradient(90deg, #12364f, #1b6aa3);
      color: #fff; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 650; }
    header p { margin: 2px 0 0; opacity: .85; font-size: 12px; }
    .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 12px; padding: 12px; min-height: calc(100vh - 64px); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    h2 { margin: 0 0 10px; font-size: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, textarea, select {
      width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
      font: inherit; background: #fff;
    }
    textarea { min-height: 52px; resize: vertical; }
    .owners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .drop {
      border: 2px dashed #9ab4c8; border-radius: 12px; background: #f8fbfe;
      padding: 22px; text-align: center; margin-bottom: 10px; cursor: pointer;
    }
    .drop.over { border-color: var(--accent); background: #eaf4fb; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    button {
      border: 0; border-radius: 7px; padding: 8px 12px; cursor: pointer; font: inherit; color: #fff;
      background: var(--accent);
    }
    button.secondary { background: #4b5c6b; }
    button.ok { background: var(--ok); }
    button.warn { background: var(--warn); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .stat { background: #eef3f7; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    .stat b { display: block; font-size: 16px; }
    .tree-group { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .tree-h { background: #eef3f7; padding: 7px 10px; font-weight: 600; cursor: pointer; }
    .tree-h.u99 { background: var(--bad-bg); color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-top: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
    tr.s-待确认 { background: var(--bad-bg); }
    tr.s-重复 { background: var(--dup-bg); }
    tr.s-已归档 { background: var(--ok-bg); }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 11px; }
    .tag-待确认 { background: var(--bad); color: #fff; }
    .tag-已归档 { background: var(--ok); color: #fff; }
    .tag-重复 { background: #4338ca; color: #fff; }
    .tag-缺失 { background: var(--warn); color: #fff; }
    .msg { font-size: 12px; color: var(--muted); min-height: 18px; }
    .err { color: var(--bad); }
    .okt { color: var(--ok); }
    .reason { color: var(--muted); max-width: 280px; }
    .result { white-space: pre-wrap; background: #f7f7f7; padding: 8px; border-radius: 6px; font-size: 12px; max-height: 240px; overflow: auto; }
    .hidden { display: none; }
    .hint { font-size: 12px; color: var(--muted); }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>项目资料归档助手</h1>
      <p>把整个资料文件夹拖进来：PCB、原理图、BOM、测试记录等会自动分到标准目录；认不出的进「99_待确认与其他」。</p>
    </div>
    <div class="hint">本地服务 · 敏感文件只标记不外传</div>
  </header>
  <div class="wrap">
    <aside class="card">
      <h2>项目信息</h2>
      <p class="hint" id="cfgHint">可从 project.yaml 预填；空字段不编造。</p>
      <label>项目名称</label><input id="project_name" />
      <label>项目工号</label><input id="project_code" placeholder="如 ZCJY260101" />
      <label>型号</label><input id="model" />
      <label>板号（每行一个，保持原样）</label><textarea id="boards" placeholder="ZC7.820.0001-V6.1"></textarea>
      <label>装配变量（每行：名称,代码）</label><textarea id="variants_text" placeholder="授时守时板卡,ZCJY260101"></textarea>
      <label>套数</label><input id="quantity" placeholder="如 2套" />
      <label>归档日期 YYYYMMDD</label><input id="archive_date" placeholder="空则用今天" />
      <div class="owners">
        <div><label>硬件</label><input id="own_hardware" /></div>
        <div><label>质量</label><input id="own_quality" /></div>
        <div><label>测试</label><input id="own_test" /></div>
        <div><label>软件</label><input id="own_software" /></div>
        <div><label>采购</label><input id="own_purchase" /></div>
        <div><label>生产</label><input id="own_production" /></div>
        <div><label>结构</label><input id="own_structure" /></div>
      </div>
      <label>输出目录</label><input id="output" placeholder="生成分类文件夹才写入" />
      <label>本机资料目录（大文件夹请用这个，不要上传）</label>
      <div style="display:flex;gap:6px;">
        <input id="local_source" placeholder="例如 E:\北斗模块\ZC7.820.0155V3" />
        <button type="button" class="secondary" id="btnBrowse" style="white-space:nowrap;padding:6px 10px;">浏览</button>
      </div>
      <p class="hint">点「浏览 / 选择本机文件夹」直接扫描磁盘，不走浏览器上传。原文件夹原样保留。</p>
    </aside>
    <main class="card">
      <div class="drop" id="drop" tabindex="0">
        <strong>把整个资料文件夹拖到这里</strong>
        <div class="hint">大文件夹请点「选择本机文件夹」，不要用浏览器上传。小文件可拖到这里。认不出的进 99。</div>
      </div>
      <div class="btns">
        <button type="button" class="secondary" id="btnFiles">选择文件</button>
        <button type="button" class="secondary" id="btnDir">选择本机文件夹</button>
        <button type="button" class="secondary" id="btnDemo">加载演示样例</button>
        <button type="button" id="btnPreview">重新识别预览</button>
        <button type="button" class="ok" id="btnApply">生成分类文件夹</button>
        <button type="button" class="secondary" id="btnOpen">打开输出目录</button>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin:6px 0;">
        <input type="checkbox" id="confirmCopy" style="width:auto" />
        我已核对分类，允许生成新的分类文件夹（只复制，不删除原文件、不覆盖）
      </label>
      <input id="fileInput" type="file" multiple class="hidden" />
      <input id="dirInput" type="file" webkitdirectory directory class="hidden" />
      <div class="msg" id="msg"></div>
      <div class="stats" id="stats"></div>
      <div id="tree"></div>
      <h2>缺失 / 待确认是否必交</h2>
      <div id="missing"></div>
      <div id="done" class="hidden">
        <h2>归档完成</h2>
        <p id="donePath" class="okt"></p>
        <div class="result" id="doneReport"></div>
      </div>
    </main>
  </div>
<script>
const state = { sessionId: "", folders: [], files: [], nameLock: {}, edited: {} };

const $ = (id) => document.getElementById(id);

function projectPayload() {
  return {
    project_name: $("project_name").value,
    project_code: $("project_code").value,
    model: $("model").value,
    boards: $("boards").value,
    variants_text: $("variants_text").value,
    quantity: $("quantity").value,
    archive_date: $("archive_date").value,
    owners: {
      hardware: $("own_hardware").value,
      quality: $("own_quality").value,
      test: $("own_test").value,
      software: $("own_software").value,
      purchase: $("own_purchase").value,
      production: $("own_production").value,
      structure: $("own_structure").value,
    },
  };
}

function collectOverrides() {
  return state.files.filter((f) => state.edited[f.id] || state.nameLock[f.id]).map((f) => ({
    id: f.id,
    rel: f.rel || f.id,
    main: f.main,
    sub: f.sub,
    extra_sub: f.extra_sub,
    folder: f.folder,
    new_name: state.nameLock[f.id] ? f.new_name : "",
  }));
}

function setMsg(text, cls) {
  const el = $("msg");
  el.className = "msg " + (cls || "");
  el.textContent = text || "";
}

function fillProject(p, hint) {
  $("project_name").value = p.project_name || "";
  $("project_code").value = p.project_code || "";
  $("model").value = p.model || "";
  $("boards").value = p.boards || "";
  $("variants_text").value = p.variants_text || "";
  $("quantity").value = p.quantity || "";
  $("archive_date").value = p.archive_date || "";
  const o = p.owners || {};
  $("own_hardware").value = o.hardware || "";
  $("own_quality").value = o.quality || "";
  $("own_test").value = o.test || "";
  $("own_software").value = o.software || "";
  $("own_purchase").value = o.purchase || "";
  $("own_production").value = o.production || "";
  $("own_structure").value = o.structure || "";
  if (hint) $("cfgHint").textContent = hint;
}

function folderSelect(file) {
  const opts = state.folders.map((fo) => {
    const sel = fo.label === file.folder ? " selected" : "";
    return `<option value="${escapeHtml(fo.label)}"${sel}>${escapeHtml(fo.label)}</option>`;
  }).join("");
  return `<select data-id="${escapeHtml(file.id)}" class="folder-sel">${opts}</select>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderStats(stats) {
  if (!stats) { $("stats").innerHTML = ""; return; }
  const items = [
    ["总数", stats.total],
    ["已分类", stats.classified],
    ["待确认", stats.pending],
    ["重复", stats.duplicate],
    ["敏感", stats.sensitive],
    ["缺失(矩阵)", stats.missing],
    ["待确认是否必交", stats.maybe_required],
  ];
  $("stats").innerHTML = items.map(([k, v]) => `<div class="stat"><b>${v ?? 0}</b>${k}</div>`).join("");
}

function renderTree(files) {
  const groups = {};
  for (const f of files) {
    const g = f.main || "99_待确认与其他";
    (groups[g] ||= []).push(f);
  }
  const order = Object.keys(groups).sort();
  let html = "";
  for (const g of order) {
    const bad = g.startsWith("99") ? " u99" : "";
    html += `<div class="tree-group"><div class="tree-h${bad}">${escapeHtml(g)}（${groups[g].length}）</div>`;
    html += `<table><thead><tr><th>原文件名</th><th>建议新文件名</th><th>目标文件夹</th><th>负责人</th><th>状态</th><th>置信度/原因</th></tr></thead><tbody>`;
    for (const f of groups[g]) {
      const st = f.status || "待确认";
      html += `<tr class="s-${escapeHtml(st)}">
        <td>${escapeHtml(f.original_name)}<div class="hint">${escapeHtml(f.rel || "")}</div></td>
        <td><input class="name-inp" data-id="${escapeHtml(f.id)}" value="${escapeHtml(f.new_name)}" /></td>
        <td>${folderSelect(f)}</td>
        <td>${escapeHtml(f.owner)}</td>
        <td><span class="tag tag-${escapeHtml(st)}">${escapeHtml(st)}</span>${f.sensitive ? " · 敏感" : ""}</td>
        <td class="reason">${f.confidence ?? 0}<br>${escapeHtml(f.reason)}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }
  $("tree").innerHTML = html;
  $("tree").querySelectorAll(".folder-sel").forEach((el) => {
    el.addEventListener("change", () => onFolderChange(el.dataset.id, el.value));
  });
  $("tree").querySelectorAll(".name-inp").forEach((el) => {
    el.addEventListener("change", () => {
      const f = state.files.find((x) => x.id === el.dataset.id);
      if (f) { f.new_name = el.value; state.nameLock[f.id] = true; state.edited[f.id] = true; }
    });
  });
}

function renderMissing(rows) {
  if (!rows || !rows.length) { $("missing").innerHTML = "<p class='hint'>暂无</p>"; return; }
  let html = `<table><thead><tr><th>目录</th><th>状态</th><th>负责人</th><th>原因</th></tr></thead><tbody>`;
  for (const m of rows) {
    html += `<tr class="s-${escapeHtml(m.status)}"><td>${escapeHtml(m.folder)}</td><td>${escapeHtml(m.status)}</td><td>${escapeHtml(m.owner)}</td><td class="reason">${escapeHtml(m.reason)}</td></tr>`;
  }
  html += `</tbody></table>`;
  $("missing").innerHTML = html;
}

function applyPayload(data) {
  state.files = (data.files || []).map((f) => {
    if (state.nameLock[f.id] && collectOverrides().find((o) => o.id === f.id)?.new_name) {
      /* keep unless server regenerated after folder change without lock — lock wins on next preview send */
    }
    return f;
  });
  renderStats(data.stats);
  renderTree(state.files);
  renderMissing(data.missing);
}

async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) {
    throw new Error(explainFetchError(err));
  }
  let data = {};
  try { data = await res.json(); } catch (_) { data = {}; }
  if (!res.ok) throw new Error(data.error || explainFetchError(res.statusText));
  return data;
}

function explainFetchError(err) {
  const m = String(err && err.message ? err.message : err || "");
  if (/failed to fetch|networkerror|load failed|network/i.test(m) || m === "") {
    return "这个文件夹太大，浏览器传不上去。请点「选择本机文件夹」，或把路径填到左侧「本机资料目录」后再点「重新识别预览」。";
  }
  return m;
}

async function ensureSession() {
  if (state.sessionId) return state.sessionId;
  const data = await api("/api/session", {});
  state.sessionId = data.session_id;
  return state.sessionId;
}

async function onFolderChange(id, label) {
  const f = state.files.find((x) => x.id === id);
  if (!f) return;
  f.folder = label;
  const fo = state.folders.find((x) => x.label === label);
  if (fo) { f.main = fo.main; f.sub = fo.sub; f.extra_sub = fo.extra_sub; }
  state.edited[id] = true;
  setMsg("已改分类，正在按模板重算新文件名…");
  try {
    const data = await preview();
    applyPayload(data);
    setMsg("已按新分类重算。生成分类文件夹前不会复制。");
  } catch (e) { setMsg(e.message, "err"); }
}

function previewBody() {
  return {
    session_id: state.sessionId,
    project: projectPayload(),
    output: $("output").value,
    local_source: $("local_source").value,
    overrides: collectOverrides(),
  };
}

async function preview() {
  await ensureSession();
  return api("/api/preview", previewBody());
}

const UPLOAD_LIMIT = 80 * 1024 * 1024;

async function previewLocalPath() {
  const p = ($("local_source").value || "").trim();
  if (!p) throw new Error("请先选择或填写本机资料目录。");
  setMsg("正在按本机目录识别（不上传、不写盘）…");
  const data = await preview();
  applyPayload(data);
  setMsg(`识别完成：${data.stats.total} 个文件。请核对后点「生成分类文件夹」。认不出的在 99_待确认与其他。`);
  return data;
}

async function browseLocalFolder() {
  await ensureSession();
  setMsg("请在弹出的窗口里选择资料文件夹…");
  const data = await api("/api/browse", { session_id: state.sessionId });
  if (!data.path) {
    setMsg("未选择文件夹。");
    return;
  }
  $("local_source").value = data.path;
  state.edited = {};
  state.nameLock = {};
  await previewLocalPath();
}

async function uploadFileList(fileList) {
  if (!fileList || !fileList.length) return;
  const total = [...fileList].reduce((s, f) => s + (f.size || 0), 0);
  if (total > UPLOAD_LIMIT) {
    throw new Error(
      `这个文件夹约 ${(total / 1024 / 1024).toFixed(0)}MB，浏览器传不上去。请点「选择本机文件夹」，或把路径填到左侧「本机资料目录」。`
    );
  }
  await ensureSession();
  setMsg(`正在上传 ${fileList.length} 个文件…`);
  const fd = new FormData();
  for (const file of fileList) {
    const rel = file.webkitRelativePath || file.relativePath || file.name;
    fd.append("files", file, rel);
  }
  let res;
  try {
    res = await fetch("/api/upload?session_id=" + encodeURIComponent(state.sessionId), { method: "POST", body: fd });
  } catch (err) {
    throw new Error(explainFetchError(err));
  }
  let data = {};
  try { data = await res.json(); } catch (_) { data = {}; }
  if (!res.ok) throw new Error(data.error || explainFetchError("上传失败"));
  state.sessionId = data.session_id;
  state.edited = {};
  state.nameLock = {};
  $("local_source").value = "";
  setMsg(`已上传 ${data.uploaded} 个，正在识别…`);
  const prev = await preview();
  applyPayload(prev);
  setMsg(`识别完成：${prev.stats.total} 个文件。请核对后点「生成分类文件夹」。认不出的在 99_待确认与其他。`);
}

async function readAllEntries(dirEntry) {
  const reader = dirEntry.createReader();
  const all = [];
  for (;;) {
    const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
    if (!batch.length) break;
    all.push(...batch);
  }
  return all;
}

async function walkEntry(entry, prefix, acc) {
  if (entry.isFile) {
    const skip = /^(thumbs\.db|desktop\.ini|\.ds_store)$/i.test(entry.name);
    if (skip) return;
    await new Promise((resolve, reject) => {
      entry.file((file) => {
        file.relativePath = prefix + file.name;
        acc.push(file);
        resolve();
      }, reject);
    });
  } else if (entry.isDirectory) {
    if (/^(\.git|__pycache__|\.svn)$/i.test(entry.name)) return;
    const children = await readAllEntries(entry);
    for (const child of children) {
      await walkEntry(child, prefix + entry.name + "/", acc);
    }
  }
}

$("drop").addEventListener("dragover", (e) => { e.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", async (e) => {
  e.preventDefault();
  $("drop").classList.remove("over");
  try {
    const items = e.dataTransfer.items;
    const acc = [];
    if (items && items.length) {
      const tasks = [];
      for (const it of items) {
        const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
        if (entry) tasks.push(walkEntry(entry, "", acc));
      }
      if (tasks.length) {
        await Promise.all(tasks);
        await uploadFileList(acc);
        return;
      }
    }
    await uploadFileList(e.dataTransfer.files);
  } catch (err) { setMsg(err.message, "err"); }
});
$("drop").addEventListener("click", () => $("btnDir").click());
$("btnFiles").addEventListener("click", () => $("fileInput").click());
$("btnDir").addEventListener("click", () => browseLocalFolder().catch((err) => setMsg(err.message, "err")));
$("btnBrowse").addEventListener("click", () => browseLocalFolder().catch((err) => setMsg(err.message, "err")));
$("fileInput").addEventListener("change", (e) => uploadFileList(e.target.files).catch((err) => setMsg(err.message, "err")));
$("dirInput").addEventListener("change", (e) => uploadFileList(e.target.files).catch((err) => setMsg(err.message, "err")));

$("btnPreview").addEventListener("click", async () => {
  try {
    setMsg("正在识别预览（不写盘）…");
    const data = await preview();
    applyPayload(data);
    setMsg(`预览完成，共 ${data.stats.total} 个文件。未复制。`);
  } catch (e) { setMsg(e.message, "err"); }
});

$("btnDemo").addEventListener("click", async () => {
  try {
    await ensureSession();
    setMsg("正在加载演示样例并识别…");
    const data = await api("/api/demo", previewBody());
    state.sessionId = data.session_id;
    state.nameLock = {};
    state.edited = {};
    applyPayload(data);
    setMsg(`演示样例 ${data.demo_files} 个已识别。可改分类后点「生成分类文件夹」。`);
  } catch (e) { setMsg(e.message, "err"); }
});

$("btnApply").addEventListener("click", async () => {
  if (!state.files.length && !$("local_source").value) {
    setMsg("请先拖入文件或填写本机目录。", "err");
    return;
  }
  if (!$("confirmCopy").checked) {
    setMsg("请先勾选「允许生成新的分类文件夹」。识别预览不会写盘。", "err");
    return;
  }
  try {
    setMsg("正在复制归档…");
    const data = await api("/api/apply", previewBody());
    applyPayload(data);
    $("done").classList.remove("hidden");
    $("donePath").textContent = "输出目录：" + data.output + "（已复制 " + data.copied + " 个）";
    $("doneReport").textContent = data.report_excerpt || "";
    setMsg("归档完成。源文件仍保留。", "okt");
  } catch (e) { setMsg(e.message, "err"); }
});

$("btnOpen").addEventListener("click", async () => {
  try {
    const p = $("output").value || ($("donePath").textContent.replace("输出目录：", "").split("（")[0]);
    if (!p) { setMsg("请先填写输出目录或完成归档。", "err"); return; }
    await api("/api/open", { path: p.trim() });
    setMsg("已请求打开：" + p);
  } catch (e) { setMsg(e.message, "err"); }
});

(async function init() {
  try {
    const res = await fetch("/api/bootstrap");
    const data = await res.json();
    state.folders = data.folders || [];
    fillProject(data.project, data.config_path ? ("已预填：" + data.config_path) : "未找到 project.yaml，字段留空。");
    $("output").value = data.default_output || "";
    await ensureSession();
  } catch (e) { setMsg("初始化失败：" + e.message, "err"); }
})();
</script>
</body>
</html>
